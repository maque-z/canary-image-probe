services:
  canary:
    build: .
    image: canary-image-probe:latest
    container_name: canary-image-probe
    restart: unless-stopped
    ports:
      # 左边是宿主机端口，按需改。80 需要 root 或已放行
      - "8080:8080"
    volumes:
      # 命中日志持久化到宿主机 ./data/canary_hits.jsonl
      - ./data:/data
    environment:
      - CANARY_DATA=/data
      - TZ=UTC
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
